name: Prototype motion

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/**'
      - 'scripts/prototype_motion.py'
      - '.github/workflows/prototype-motion.yml'
  workflow_dispatch:

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
          blender --version
      - name: Build restrained prototype animation
        run: |
          blender --background --python-exit-code 1 --python scripts/prototype_motion.py -- --model=assets/models/glimmerkin.glb
      - name: Show report
        run: |
          cat output/prototype-motion/report.json
          ls -lh output/prototype-motion
      - name: Upload prototype artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchid-prototype-motion
          path: output/prototype-motion/
          retention-days: 7
          if-no-files-found: error
