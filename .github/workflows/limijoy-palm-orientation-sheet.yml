name: Limijoy palm orientation sheet
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/**'
      - 'scripts/limijoy_arm_semantic_controls.py'
      - 'scripts/limijoy_palm_orientation_sheet.py'
      - '.github/workflows/limijoy-palm-orientation-sheet.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy imagemagick libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
      - name: Render semantic palm and elbow poses
        run: blender --background --python-exit-code 1 --python scripts/limijoy_palm_orientation_sheet.py -- --model=assets/models/glimmerkin.glb
      - name: Assemble contact sheets
        run: |
          montage output/limijoy-palm-orientation-sheet/stills/*_front.png -thumbnail 320x320 -tile 6x3 -geometry +8+30 -background '#20202a' -fill white -pointsize 16 -set label '%t' output/limijoy-palm-orientation-sheet/pose-sheet-front.png
          montage output/limijoy-palm-orientation-sheet/stills/*_side.png -thumbnail 320x320 -tile 6x3 -geometry +8+30 -background '#20202a' -fill white -pointsize 16 -set label '%t' output/limijoy-palm-orientation-sheet/pose-sheet-side.png
          montage output/limijoy-palm-orientation-sheet/stills/*_three-quarter.png -thumbnail 320x320 -tile 6x3 -geometry +8+30 -background '#20202a' -fill white -pointsize 16 -set label '%t' output/limijoy-palm-orientation-sheet/pose-sheet-three-quarter.png
      - name: Upload semantic orientation diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: limijoy-palm-orientation-sheet
          path: output/limijoy-palm-orientation-sheet/
          retention-days: 7
          if-no-files-found: error
