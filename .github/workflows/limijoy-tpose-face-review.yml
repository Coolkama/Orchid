name: Limijoy T-pose face review

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/glimmerkin-tpose-blank-face-candidate.glb'
      - 'scripts/generate_limijoy_tpose_face_textures.py'
      - 'scripts/limijoy_tpose_face_review.py'
      - 'scripts/limijoy_rig_profiles.py'
      - 'scripts/limijoy_rig_profile_adapter.py'
      - 'scripts/limijoy_body_semantic_controls.py'
      - '.github/workflows/limijoy-tpose-face-review.yml'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil imagemagick libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
          blender --version

      - name: Generate revised expression overlays
        run: |
          python3 scripts/generate_limijoy_tpose_face_textures.py \
            --output output/limijoy-tpose-face-review/textures

      - name: Render revised face on keeper model
        run: |
          blender --background --python-exit-code 1 \
            --python scripts/limijoy_tpose_face_review.py -- \
            --model=assets/models/glimmerkin-tpose-blank-face-candidate.glb \
            --textures=output/limijoy-tpose-face-review/textures

      - name: Verify review outputs
        run: |
          test -f output/limijoy-tpose-face-review/renders/10-neutral-front.png
          test -f output/limijoy-tpose-face-review/renders/10-blink-front.png
          test -f output/limijoy-tpose-face-review/renders/10-happy-front.png
          test -f output/limijoy-tpose-face-review/renders/20-head-left.png
          test -f output/limijoy-tpose-face-review/renders/20-head-right.png
          test -f output/limijoy-tpose-face-review/renders/20-head-up.png
          test -f output/limijoy-tpose-face-review/renders/20-head-down.png
          test -f output/limijoy-tpose-face-review/face-review-report.json

      - name: Build labelled comparison sheet
        run: |
          montage output/limijoy-tpose-face-review/renders/*.png \
            -thumbnail 460x460 \
            -tile 3x \
            -geometry +18+38 \
            -background '#17151d' \
            -fill '#f5f0e8' \
            -stroke none \
            -pointsize 20 \
            -set label '%t' \
            output/limijoy-tpose-face-review/face-comparison.png

      - name: List generated files
        run: |
          find output/limijoy-tpose-face-review -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Upload face review
        uses: actions/upload-artifact@v4
        with:
          name: limijoy-tpose-face-review
          path: output/limijoy-tpose-face-review/
          retention-days: 7
          if-no-files-found: error
