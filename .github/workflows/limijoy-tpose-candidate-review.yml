name: Limijoy T-pose candidate review

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/glimmerkin-tpose-blank-face-candidate.glb'
      - 'scripts/limijoy_rig_profiles.py'
      - 'scripts/limijoy_rig_profile_adapter.py'
      - 'scripts/limijoy_arm_semantic_controls.py'
      - 'scripts/limijoy_body_semantic_controls.py'
      - 'scripts/limijoy_semantic_actions.py'
      - 'scripts/limijoy_tpose_candidate_review.py'
      - '.github/workflows/limijoy-tpose-candidate-review.yml'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy imagemagick libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
          blender --version

      - name: Verify T-pose candidate model is present
        run: |
          test -s assets/models/glimmerkin-tpose-blank-face-candidate.glb
          ls -lh assets/models/glimmerkin-tpose-blank-face-candidate.glb

      - name: Render motion and topology review
        run: |
          blender --background --python-exit-code 1 \
            --python scripts/limijoy_tpose_candidate_review.py -- \
            --model=assets/models/glimmerkin-tpose-blank-face-candidate.glb

      - name: Build motion comparison sheet
        if: always()
        run: |
          if compgen -G 'output/limijoy-tpose-candidate-review/stills/*.png' > /dev/null; then
            montage output/limijoy-tpose-candidate-review/stills/*.png \
              -thumbnail 420x420 \
              -tile 4x \
              -geometry +16+34 \
              -background '#17151d' \
              -fill '#f5f0e8' \
              -stroke none \
              -pointsize 18 \
              -set label '%t' \
              output/limijoy-tpose-candidate-review/motion-comparison.png
          fi

      - name: List generated files
        if: always()
        run: |
          find output/limijoy-tpose-candidate-review -maxdepth 2 -type f -printf '%p %k KB\n' 2>/dev/null | sort || true

      - name: Upload T-pose review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limijoy-tpose-candidate-review
          path: output/limijoy-tpose-candidate-review/
          retention-days: 7
          if-no-files-found: warn
