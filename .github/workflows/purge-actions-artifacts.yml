name: Purge Actions artifacts

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  purge:
    if: github.event.issue.title == 'PURGE_ACTIONS_ARTIFACTS_NOW' && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete every Actions artifact in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          before=$(gh api --paginate "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' | wc -l)
          echo "Artifacts before purge: $before"
          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r id; do
              [ -n "$id" ] || continue
              gh api --method DELETE "repos/$repo/actions/artifacts/$id"
            done
          after=$(gh api --paginate "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' | wc -l)
          echo "Artifacts after purge: $after"
          test "$after" -eq 0
