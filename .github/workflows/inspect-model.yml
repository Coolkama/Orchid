name: Inspect model

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/**'
      - 'scripts/inspect_glb.py'
      - '.github/workflows/inspect-model.yml'
  workflow_dispatch:
    inputs:
      model_path:
        description: Repository path to the GLB to inspect
        required: true
        default: assets/models/glimmerkin.glb

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select model path
        id: model
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.model_path }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=assets/models/glimmerkin.glb" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify model exists
        run: |
          MODEL="${{ steps.model.outputs.path }}"
          test -f "$MODEL" || { echo "Model not found: $MODEL"; exit 1; }
          ls -lh "$MODEL"

      - name: Install Blender and headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
          blender --version

      - name: Inspect and render model
        run: |
          blender --background --python-exit-code 1 --python scripts/inspect_glb.py -- --model="${{ steps.model.outputs.path }}"

      - name: Show inspection report
        run: |
          cat output/inspection/report.json
          ls -lh output/inspection

      - name: Upload inspection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchid-model-inspection
          path: output/inspection/
          retention-days: 7
          if-no-files-found: error
