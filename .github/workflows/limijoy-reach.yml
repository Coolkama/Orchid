name: Limijoy reach
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/**'
      - 'scripts/limijoy_arm_semantic_controls.py'
      - 'scripts/limijoy_semantic_reach.py'
      - '.github/workflows/limijoy-reach.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy ffmpeg libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
      - name: Render reach
        run: blender --background --python-exit-code 1 --python scripts/limijoy_semantic_reach.py -- --model=assets/models/glimmerkin.glb
      - name: Upload semantic reach preview
        uses: actions/upload-artifact@v4
        with:
          name: limijoy-reach-preview
          path: |
            output/limijoy-reach/preview.mp4
            output/limijoy-reach/preview.gif
            output/limijoy-reach/reach_report.json
          retention-days: 7
          if-no-files-found: error
