name: Limijoy first step
on:
  pull_request:
    branches: [main]
    paths: ['assets/models/**','scripts/limijoy_first_step.py','.github/workflows/limijoy-first-step.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy ffmpeg libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
      - name: Render first step
        run: blender --background --python-exit-code 1 --python scripts/limijoy_first_step.py -- --model=assets/models/glimmerkin.glb
      - name: Upload preview only
        uses: actions/upload-artifact@v4
        with:
          name: limijoy-first-step-preview
          path: |
            output/limijoy-first-step/preview.mp4
            output/limijoy-first-step/preview.gif
          retention-days: 7
          if-no-files-found: error