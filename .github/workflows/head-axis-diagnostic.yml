name: Head axis diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/models/**'
      - 'scripts/head_axis_diagnostic.py'
      - '.github/workflows/head-axis-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose-head-axes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg python3-numpy libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
      - name: Render head axis diagnostic
        run: blender --background --python-exit-code 1 --python scripts/head_axis_diagnostic.py -- --model=assets/models/glimmerkin.glb
      - name: Build preview MP4 and GIF
        run: |
          cd output/head-axis-diagnostic
          ffmpeg -y -framerate 24 -i axis_%03d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart preview.mp4
          ffmpeg -y -framerate 24 -i axis_%03d.png -vf "fps=12,scale=512:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" -loop 0 preview.gif
      - name: Upload preview only
        uses: actions/upload-artifact@v4
        with:
          name: limijoy-head-axis-preview
          path: |
            output/head-axis-diagnostic/preview.mp4
            output/head-axis-diagnostic/preview.gif
          retention-days: 7
          if-no-files-found: error